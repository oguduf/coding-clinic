apiVersion: v1
kind: ConfigMap
metadata:
  name: database-secret-config
  namespace: demo
  annotations:
    secret-sync.example.com/enabled: "true"
    secret-sync.example.com/aws-secret-name: "demo/database"
    secret-sync.example.com/target-secret-name: "database-credentials"
data:
  # Non-sensitive application settings only; never place secret values here.
  CONFIG_SOURCE: "aws-secrets-manager"

