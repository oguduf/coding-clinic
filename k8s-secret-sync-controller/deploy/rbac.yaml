apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-sync-controller
  namespace: demo
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    # Kopf persists handler progress on the ConfigMap annotations.
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secret-sync-controller
  namespace: demo
subjects:
  - kind: ServiceAccount
    name: secret-sync-controller
    namespace: demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secret-sync-controller

