apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-sync-controller
  namespace: demo
  labels:
    app.kubernetes.io/name: secret-sync-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: secret-sync-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: secret-sync-controller
    spec:
      serviceAccountName: secret-sync-controller
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          # Replace this placeholder with an image built and published separately.
          image: ghcr.io/example-org/k8s-secret-sync-controller:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["kopf"]
          args:
            - run
            - --standalone
            - --namespace=$(POD_NAMESPACE)
            - /app/controller.py
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: AWS_REGION
              # Replace with the region containing the approved Secrets Manager secret.
              value: REPLACE_WITH_AWS_REGION
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

