apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: demo-app-multicluster
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - environment: dev
            cluster: cluster-dev
            server: https://api.dev.example.invalid
            namespace: app-dev
            overlay: app/overlays/dev
          - environment: stage
            cluster: cluster-stage
            server: https://api.stage.example.invalid
            namespace: app-stage
            overlay: app/overlays/stage
          - environment: prod
            cluster: cluster-prod
            server: https://api.prod.example.invalid
            namespace: app-prod
            overlay: app/overlays/prod
  template:
    metadata:
      name: demo-app-{{environment}}
    spec:
      project: default
      source:
        repoURL: https://github.com/example-org/argocd-multicluster-gitops.git
        targetRevision: main
        path: '{{overlay}}'
      destination:
        server: '{{server}}'
        namespace: '{{namespace}}'
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
