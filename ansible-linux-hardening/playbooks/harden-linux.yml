---
- name: Apply the approved Linux security baseline
  hosts: linux
  gather_facts: false
  become: true
  serial: 10%
  any_errors_fatal: true
  vars_files:
    - ../group_vars/all.yml

  pre_tasks:
    - name: Require explicit change approval before connecting to managed hosts
      ansible.builtin.assert:
        that:
          - hardening_approved | bool
        fail_msg: >-
          No hosts were contacted. Set hardening_approved=true only for an approved,
          scoped change using a real inventory.
      delegate_to: localhost
      become: false
      run_once: true
      tags: [always]

    - name: Gather target facts after approval
      ansible.builtin.setup:
      tags: [always]

    - name: Load Ubuntu-specific configuration
      ansible.builtin.include_vars:
        file: ../group_vars/ubuntu.yml
      when: ansible_facts.distribution == "Ubuntu"
      tags: [always]

    - name: Load RHEL-specific configuration
      ansible.builtin.include_vars:
        file: ../group_vars/rhel.yml
      when: ansible_facts.distribution == "RedHat"
      tags: [always]

    - name: Reject unsupported operating systems and service managers
      ansible.builtin.assert:
        that:
          - ansible_facts.service_mgr == "systemd"
          - >-
            (ansible_facts.os_family == "Debian" and
            ansible_facts.distribution == "Ubuntu" and ansible_facts.pkg_mgr == "apt" and
            ansible_facts.distribution_version in ["22.04", "24.04"]) or
            (ansible_facts.os_family == "RedHat" and
            ansible_facts.distribution == "RedHat" and ansible_facts.pkg_mgr in ["dnf", "yum"] and
            ansible_facts.distribution_major_version in ["8", "9"])
        fail_msg: >-
          Supported targets are Ubuntu 22.04/24.04 and RHEL 8/9 with systemd.
          Detected {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}
          using {{ ansible_facts.service_mgr }}.
      tags: [always]

    - name: Validate environment policy prerequisites before any role changes
      ansible.builtin.assert:
        that:
          - >-
            ansible_facts.distribution != "RedHat" or not (fail2ban_enabled | bool)
            or (fail2ban_rhel_repository_ready | bool)
          - >-
            not (fail2ban_enabled | bool) or
            (fail2ban_bantime | int > 0 and fail2ban_findtime | int > 0 and
            fail2ban_maxretry | int > 0 and fail2ban_ignoreip | length > 0 and
            '0.0.0.0/0' not in fail2ban_ignoreip and '::/0' not in fail2ban_ignoreip)
          - not (security_updates_enabled | bool) or security_updates_schedule in ['daily', 'weekly']
          - not (security_updates_enabled | bool) or security_updates_auto_reboot_time is match('^([01][0-9]|2[0-3]):[0-5][0-9]$')
        fail_msg: >-
          Review environment policy inputs. RHEL Fail2ban requires an approved
          package source, and update schedule/time values must be valid.
      tags: [always]

  roles:
    - role: ssh_hardening
      tags: [ssh, security]
    - role: fail2ban
      tags: [fail2ban, security]
    - role: security_updates
      tags: [updates, security]

