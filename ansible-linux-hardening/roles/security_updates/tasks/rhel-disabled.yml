---
- name: Gather available systemd units before disabling automatic updates
  ansible.builtin.service_facts:

- name: Stop and disable existing DNF automatic timers
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop: "{{ security_updates_rhel_competing_timers + [security_updates_rhel_install_timer] }}"
  when: item in ansible_facts.services

