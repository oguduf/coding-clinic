name: Terraform plan policy validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Validate Python syntax and JSON fixtures
        run: |
          python -m py_compile validator.py tests/test_validator.py
          python -m json.tool policies.json > /dev/null
          python -m json.tool examples/compliant-plan.json > /dev/null
          python -m json.tool examples/noncompliant-plan.json > /dev/null
          python -m json.tool examples/compliant-cost.json > /dev/null
          python -m json.tool examples/over-budget-cost.json > /dev/null
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Validate compliant fixture
        run: python validator.py --plan examples/compliant-plan.json --policy policies.json --cost examples/compliant-cost.json
      - name: Confirm noncompliant fixture fails policy
        shell: bash
        run: |
          set +e
          python validator.py --plan examples/noncompliant-plan.json --policy policies.json --cost examples/over-budget-cost.json
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "Expected policy failure exit code 1; received $status" >&2
            exit 1
          fi
