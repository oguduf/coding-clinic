name: Kustomize validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Kustomize
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v5.8.3/kustomize_v5.8.3_linux_amd64.tar.gz \
            | tar -xz
          sudo install kustomize /usr/local/bin/kustomize
          rm kustomize
      - name: Install YAML linter
        run: python -m pip install --disable-pip-version-check yamllint==1.38.0
      - name: Lint YAML
        run: yamllint -d '{extends: relaxed, rules: {line-length: disable}}' kustomize-observability-component
      - name: Render both examples
        run: |
          kustomize build kustomize-observability-component/examples/app-one >/dev/null
          kustomize build kustomize-observability-component/examples/app-two >/dev/null
      - name: Run offline tests
        run: python -m unittest discover -s kustomize-observability-component/tests -v
