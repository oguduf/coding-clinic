name: Validate semantic release action

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'
      - name: Check Python syntax
        run: python -m py_compile scripts/release.py tests/test_release.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate action metadata
        run: ruby -e "require 'yaml'; YAML.load_file('action.yml')"
      - name: Exercise release script in dry-run mode
        run: python scripts/release.py --dry-run true --create-tag false --push-tag false
