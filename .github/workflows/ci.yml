name: Argo CD Kustomize validation

on:
  pull_request:
    paths:
      - 'argocd-multicluster-gitops/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'argocd-multicluster-gitops/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: argocd-multicluster-gitops
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Set up kubectl and Kustomize
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.4
      - name: Install YAML validation tools
        run: python -m pip install PyYAML==6.0.3 yamllint==1.38.0
      - name: Lint YAML manifests
        run: yamllint -d relaxed applicationset.yaml app
      - name: Validate overlays and ApplicationSet
        run: bash scripts/validate.sh
