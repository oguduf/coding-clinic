name: Coding Clinic CI

on:
  pull_request:
    paths:
      - 'k8s-secret-sync-controller/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'k8s-secret-sync-controller/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  validate-secret-sync-controller:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: k8s-secret-sync-controller
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install project dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run Ruff
        run: ruff check .
      - name: Run offline pytest suite
        run: pytest -v
      - name: Validate project and workflow YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          files = sorted(Path(".").rglob("*.yaml")) + sorted(Path(".").rglob("*.yml"))
          files.append(Path("../.github/workflows/ci.yml"))
          for path in files:
              with path.open(encoding="utf-8") as stream:
                  list(yaml.safe_load_all(stream))
          print(f"Parsed {len(files)} YAML files.")
          PY

