name: Coding Clinic CI

on:
  pull_request:
    paths:
      - 'kubernetes-pod-security-auditor/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'kubernetes-pod-security-auditor/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  validate-pod-security-auditor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kubernetes-pod-security-auditor
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Validate Python syntax
        run: python -m py_compile auditor.py tests/test_auditor.py
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Audit compliant fixture
        run: python auditor.py --input examples/compliant-pods.json --config config.json
      - name: Confirm noncompliant fixture fails
        run: |
          status=0
          python auditor.py --input examples/noncompliant-pods.json --config config.json || status=$?
          if [ "$status" -ne 1 ]; then
            echo "Expected noncompliant fixture to exit 1; got $status" >&2
            exit 1
          fi
      - name: Validate configuration and fixture JSON
        run: |
          python -m json.tool config.json > /dev/null
          python -m json.tool examples/compliant-pods.json > /dev/null
          python -m json.tool examples/noncompliant-pods.json > /dev/null

