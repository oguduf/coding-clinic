image:
  repository: nginxinc/nginx-unprivileged
  tag: "1.27.5-alpine"
app:
  config:
    APP_ENV: production
    LOG_LEVEL: warn
resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 6
  targetCPUUtilizationPercentage: 65
pdb:
  enabled: true
  minAvailable: 2
networkPolicy:
  enabled: true
  egress:
    extraCIDRs:
      - 198.51.100.25/32
externalSecrets:
  enabled: true
  secretStore:
    name: example-prod-store
    kind: ClusterSecretStore
  targetSecretName: app-prod-secrets
  data:
    - secretKey: DATABASE_PASSWORD
      remoteRef:
        key: demo/prod/database
        property: password
