replicaCount: 1
image:
  repository: nginxinc/nginx-unprivileged
  tag: "1.27.5-alpine"
app:
  config:
    APP_ENV: development
    LOG_LEVEL: debug
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
autoscaling:
  enabled: false
pdb:
  enabled: false
networkPolicy:
  enabled: true
externalSecrets:
  enabled: false
