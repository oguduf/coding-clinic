name: Semantic Release Preparation

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history and tags
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Prepare release (dry-run)
        id: release
        uses: example-org/github-actions-semantic-release@v1
        with:
          dry-run: 'true'
          create-tag: 'false'
          push-tag: 'false'
      - name: Display planned version
        run: echo "Next version: ${{ steps.release.outputs.next-version }} (${{ steps.release.outputs.release-type }})"
