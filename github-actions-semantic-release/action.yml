name: Semantic release preparation
description: Calculate a Conventional Commit release, changelog and optional Git tag.
inputs:
  dry-run:
    description: Print the planned release without repository changes.
    required: false
    default: 'true'
  create-tag:
    description: Create a local annotated tag (requires dry-run=false).
    required: false
    default: 'false'
  push-tag:
    description: Push the tag only after explicit authorization and protection checks.
    required: false
    default: 'false'
outputs:
  current-version:
    description: Latest valid tagged version, or 0.0.0 before the first release.
    value: ${{ steps.release.outputs.current-version }}
  next-version:
    description: Calculated next version, or current version when no release is needed.
    value: ${{ steps.release.outputs.next-version }}
  release-type:
    description: major, minor, patch, or none.
    value: ${{ steps.release.outputs.release-type }}
  tag-name:
    description: Planned v-prefixed tag, or empty when there is no release.
    value: ${{ steps.release.outputs.tag-name }}
  changelog:
    description: Generated changelog section, or empty when there is no release.
    value: ${{ steps.release.outputs.changelog }}
runs:
  using: composite
  steps:
    - name: Prepare semantic release
      shell: bash
      env:
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
        INPUT_CREATE_TAG: ${{ inputs.create-tag }}
        INPUT_PUSH_TAG: ${{ inputs.push-tag }}
        GITHUB_REF_PROTECTED: ${{ github.ref_protected }}
        RELEASE_PUBLISH_AUTHORIZED: ${{ vars.RELEASE_PUBLISH_AUTHORIZED }}
        GITHUB_TOKEN: ${{ github.token }}
      run: python3 "${{ github.action_path }}/scripts/release.py" --dry-run "$INPUT_DRY_RUN" --create-tag "$INPUT_CREATE_TAG" --push-tag "$INPUT_PUSH_TAG"
