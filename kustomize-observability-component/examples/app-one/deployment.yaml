apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-one
  labels:
    observability.example.com/enabled: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: app-one
  template:
    metadata:
      labels:
        app.kubernetes.io/name: app-one
        observability.example.com/enabled: "true"
      annotations: {}
    spec:
      securityContext:
        fsGroup: 2000
      volumes: []
      containers:
        - name: application
          image: busybox:1.37.0
          command: ["/bin/sh", "-c"]
          args:
            - while true; do echo "$(date '+%Y-%m-%dT%H:%M:%S%z') app-one synthetic event" >> /var/log/app/app-one.log; sleep 10; done
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 2000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts: []
