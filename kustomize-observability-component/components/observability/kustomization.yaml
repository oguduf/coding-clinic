apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - fluent-bit-configmap.yaml
patches:
  - path: sidecars.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      labelSelector: observability.example.com/enabled=true
  - path: security.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      labelSelector: observability.example.com/enabled=true
