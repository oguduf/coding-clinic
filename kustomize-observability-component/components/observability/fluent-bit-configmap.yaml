apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush        1
        Log_Level    info

    [INPUT]
        Name              tail
        Path              /var/log/app/*.log
        Tag               observability.app
        Read_from_Head    On
        Refresh_Interval  5
        Skip_Long_Lines   On

    [OUTPUT]
        Name   stdout
        Match  observability.app
